name = "kolmogorov_complexity"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["KolmogorovMathlib"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.32.1"



[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

# Do NOT require doc-gen4 here (leanblueprint adds it by default; it was removed).
# doc-gen4 requires Cli directly, which overrides the Cli revision Mathlib pins
# transitively via importGraph; `lake exe cache get` then computes wrong hashes and
# refuses to fetch. CI builds the API docs with leanprover-community/docgen-action,
# which isolates doc-gen4 in its own `docbuild/` workspace. See Learnings.md.

[[lean_lib]]
name = "KolmogorovMathlib"

[[lean_lib]]
name = "Gacs_Chapter_2"
