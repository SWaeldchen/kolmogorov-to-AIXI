name: Compile blueprint

on:
  push:
    branches:
      - main # Trigger on pushes to the default branch
  workflow_dispatch:        # Allow manual triggering of the workflow from the GitHub Actions interface

# Cancel previous runs if a new commit is pushed to the same PR or branch
concurrency:
  group: ${{ github.ref }}  # Group runs by the ref (branch or PR)
  cancel-in-progress: true  # Cancel any ongoing runs in the same group

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read          # Read access to repository contents
  pages: write            # Write access to GitHub Pages
  id-token: write         # Write access to ID tokens
  issues: write           # Write access to issues
  pull-requests: write    # Write access to pull requests

jobs:
  build_project:
    runs-on: ubuntu-latest
    name: Build project
    steps:
      - name: Cleanup to free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.0
        with:
          tool-cache: false
          android: true
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false

      # The API-docs step of docgen-action runs doc-gen4 on the whole import
      # closure (Mathlib included, ~6300 jobs), several processes at a time, and
      # Lake has no option to lower that parallelism.  Since November 2026 it
      # fails with "resource exhausted (error code: 12, cannot allocate memory)"
      # when Lake starts a process; 16G of extra swap alone did not help.
      # Under investigation: the steps below report the memory settings and the
      # memory curve as annotations (readable without login through the
      # check-runs API), and let the kernel overcommit, so that starting a
      # process is not refused on accounting grounds.
      - name: Add swap space and allow overcommit
        run: |
          sudo fallocate -l 16G /mnt/extra.swap
          sudo chmod 600 /mnt/extra.swap
          sudo mkswap /mnt/extra.swap
          sudo swapon /mnt/extra.swap
          before="overcommit_memory=$(cat /proc/sys/vm/overcommit_memory) ratio=$(cat /proc/sys/vm/overcommit_ratio)"
          sudo sysctl -w vm.overcommit_memory=1
          meminfo=$(awk '/MemTotal|SwapTotal|CommitLimit|Committed_AS/{printf "%s%dM ", $1, $2/1024}' /proc/meminfo)
          echo "::notice title=runner memory settings::${before} -> now $(cat /proc/sys/vm/overcommit_memory); ${meminfo}; nproc=$(nproc); max_map_count=$(cat /proc/sys/vm/max_map_count); $(. /etc/os-release; echo $PRETTY_NAME); kernel $(uname -r)"
          free -h
          df -h / /mnt

      - name: Start memory monitor
        run: |
          nohup bash -c 'while true; do
            echo "$(date +%T) $(awk "/MemAvailable|SwapFree|Committed_AS/{printf \"%s%d \", \$1, \$2/1024}" /proc/meminfo) $(ps -eo rss,comm --sort=-rss | sed -n 2,4p | awk "{printf \"%s:%dM \", \$2, \$1/1024}")"
            sleep 15
          done' > /tmp/memlog 2>&1 &

      - name: Checkout project
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: Build project
        uses: leanprover/lean-action@434f25c2f80ded67bba02502ad3a86f25db50709 # 2025-07-02
        with:
          build: true
          # lint is off because this project configures no lint driver, and
          # `lake check-lint` then fails the whole step before anything is built.
          # Mathlib's standard linter set already runs during `lake build`, via
          # weak.linter.mathlibStandardSet in lakefile.toml.
          lint: false
          # mk_all-check is off on purpose: `lake exe mk_all` regenerates the
          # library root files without their copyright header, and we keep the
          # header on KolmogorovMathlib.lean.  Run `lake exe mk_all --check`
          # locally after adding a file, then restore the header.
          mk_all-check: false

      - name: Compile blueprint and documentation
        uses: leanprover-community/docgen-action@deed0cdc44dd8e5de07a300773eb751d33e32fc8 # 2025-10-26
        with:
          blueprint: true
          homepage: home_page

      - name: Report memory curve
        if: always()
        run: |
          log=/tmp/memlog
          minavail=$(awk '{for(i=1;i<=NF;i++) if ($i ~ /^MemAvailable:/) {split($i,a,":"); print a[2]}}' $log | sort -n | head -1)
          minswap=$(awk '{for(i=1;i<=NF;i++) if ($i ~ /^SwapFree:/) {split($i,a,":"); print a[2]}}' $log | sort -n | head -1)
          maxcommit=$(awk '{for(i=1;i<=NF;i++) if ($i ~ /^Committed_AS:/) {split($i,a,":"); print a[2]}}' $log | sort -n | tail -1)
          oom=$(sudo dmesg 2>/dev/null | grep -ci -E "out of memory|oom-kill" || true)
          echo "::notice title=memory curve::samples=$(wc -l < $log) minMemAvailable=${minavail}M minSwapFree=${minswap}M maxCommitted_AS=${maxcommit}M oom_kills=${oom}"
          echo "::notice title=memory at low point::$(awk '{for(i=1;i<=NF;i++) if ($i ~ /^MemAvailable:/) {split($i,a,":"); print a[2], $0}}' $log | sort -n | head -1 | cut -d' ' -f2-)"
          echo "::notice title=memory, last samples::$(tail -4 $log | tr '\n' '|')"
          cat $log